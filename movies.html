<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies - Decidr</title>
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/theme-toggle.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand gradient-text">Decidr</a>
        <div class="navbar-nav">
            <a href="books.html">Read</a>
            <a href="food.html">Eat</a>
            <a href="movies.html" class="active">Watch</a>
            <a href="favorites.html">Favorites</a>
            <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle Theme">☀️</button>
        </div>
    </nav>
    <main class="container">
        <div class="hero-section glass-panel">
            <p class="main-tagline">
                <span class="tagline-highlight">Cinematic adventures await</span><br>
                <span>Discover your next favorite film</span>
            </p>
            <button id="Random-button" class="btn-primary" role="button" onclick="showRandomTMDbMovie()">
                🎬 Discover Movies
            </button>
        </div>
        
        <div class="filters-container glass-panel">
            <h3 class="filters-title">Refine Your Search</h3>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="genre">Genre</label>
                    <select id="genre" class="filter-select">
                        <option value="all">All Genres</option>
                        <option value="28">Action</option>
                        <option value="12">Adventure</option>
                        <option value="16">Animation</option>
                        <option value="35">Comedy</option>
                        <option value="80">Crime</option>
                        <option value="18">Drama</option>
                        <option value="10751">Family</option>
                        <option value="14">Fantasy</option>
                        <option value="27">Horror</option>
                        <option value="9648">Mystery</option>
                        <option value="10749">Romance</option>
                        <option value="878">Science Fiction</option>
                        <option value="53">Thriller</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="rating">Minimum Rating</label>
                    <input type="number" id="rating" class="filter-input" min="1" max="10" value="5" step="0.1">
                </div>
                
                <!-- Region selector removed: region is detected automatically -->
                
                <button class="apply-filters-btn btn-primary" onclick="applyFilters()" style="padding: 0.75rem;">Apply Filters</button>
            </div>
        </div>        
        <div id="movie-result" class="movie-suggestion glass-panel" style="display:none; text-align: left; padding: 1.5rem; scroll-margin-top: 100px;">
            <div style="display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap;">
                <!-- Left Column: Poster & Next Action -->
                <div style="flex: 0 0 240px; display: flex; flex-direction: column; gap: 1rem;">
                    <img id="movie-poster" alt="Movie Poster" style="width: 100%; border-radius: 8px; box-shadow: var(--shadow-sm);"/>
                    <button id="next-movie-btn" class="btn-primary" style="width: 100%; padding: 0.6rem;">Next Movie</button>
                    <button id="prev-movie-btn" class="btn-primary" disabled style="width: 100%; padding: 0.6rem; opacity: 0.5; cursor: not-allowed;">Previous Movie</button>
                </div>
                
                <!-- Right Column: Details -->
                <div style="flex: 1; min-width: 250px;">
                    <h2 id="movie-title" style="margin-top: 0; font-size: 2rem; margin-bottom: 0.5rem;"> </h2>
                    <p id="movie-overview" style="line-height: 1.5; font-size: 1rem; color: var(--text-secondary); max-height: 110px; overflow-y: auto; padding-right: 0.5rem; margin-bottom: 0.75rem;"></p>
                    <div style="margin-bottom: 0.75rem; color: var(--text-muted); font-size: 0.95rem;">
                        <span id="movie-release"></span><br>
                        <span id="movie-rating"></span>
                    </div>
                    <div id="movie-cast" style="margin-bottom: 1rem; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4;"></div>
                    
                    <div style="display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap;">
                        <a id="imdb-link" href="#" target="_blank" style="display:none; text-decoration: none; padding: 0.5rem 1rem; font-size: 0.9rem;" class="btn-primary">View on IMDb</a>
                        <button id="trailer-btn" style="display:none; padding: 0.5rem 1rem; font-size: 0.9rem;" class="btn-primary">Watch Trailer</button>
                    </div>

                    <!-- Favorites controls -->
                    <div class="fav-controls" style="justify-content: flex-start; margin-bottom: 1rem;">
                        <button id="fav-toggle-btn" class="fav-btn icon-only" aria-pressed="false" aria-label="Save to favorites" title="Save to favorites" style="width: 36px; height: 36px;">
                            <svg xmlns="http://www.w3.org/2000/svg" class="heart-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" style="width: 20px; height: 20px;">
                                <path class="heart-path" stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                            </svg>
                        </button>
                        <a id="open-favs-btn" class="btn-primary" style="text-decoration: none; padding: 0.4rem 1.2rem; font-size: 0.9rem;" title="Open favorites" href="favorites.html">Favorites</a>
                    </div>
                    
                    <!-- Streaming Availability Section -->
                    <div id="streaming-availability" style="display:none; padding: 0.75rem; background: var(--bg-surface-elevated); border-radius: var(--radius-md); font-size: 0.9rem;"></div>
                </div>
            </div>
        </div>
        
        <div class="navigation-footer">
            <button class="home-btn" onclick="window.location.href='index.html'">
                ← Back to Decidr
            </button>
        </div>

        <!-- Trailer Modal -->
        <div id="trailer-modal" class="trailer-modal" style="display: none;">
            <div class="trailer-modal-content">
                <div class="trailer-modal-header">
                    <h3 id="trailer-title">Movie Trailer</h3>
                    <button class="trailer-close-btn" onclick="closeTrailerModal()">&times;</button>
                </div>
                <div class="trailer-video-container">
                    <iframe id="trailer-iframe" 
                            width="100%" 
                            height="100%" 
                            src="" 
                            frameborder="0" 
                            allowfullscreen
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                    </iframe>
                </div>
            </div>
        </div>

    <!-- In-page favorites panel removed; navigation now goes to favorites.html -->
    </main>
    <script src="scripts/utils.js"></script>
    <script src="scripts/movies.js"></script>
</body>
</html>
