<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Decidr</title>
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/theme-toggle.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand gradient-text">Decidr</a>
        <div class="navbar-nav">
            <a href="books.html" class="active">Read</a>
            <a href="food.html">Eat</a>
            <a href="movies.html">Watch</a>
            <a href="favorites.html">Favorites</a>
            <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle Theme">☀️</button>
        </div>
    </nav>
    <main class="container">
        <div class="hero-section glass-panel">
            <p class="main-tagline">
                <span class="tagline-highlight">Literary adventures await</span><br>
                <span>Discover your next captivating read</span>
            </p>
            <button id="Random-book-button" class="btn-primary" role="button" onclick="showRandomBook()">
                📚 Discover Books
            </button>
        </div>
        
        <div class="filters-container glass-panel">
            <h3 class="filters-title">Refine Your Search</h3>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="genre">Genre</label>
                    <select id="genre" class="filter-select">
                        <option value="all">All Genres</option>
                        <option value="fiction">Fiction</option>
                        <option value="nonfiction">Non-Fiction</option>
                        <option value="fantasy">Fantasy</option>
                        <option value="mystery">Mystery</option>
                        <option value="romance">Romance</option>
                        <option value="science">Science</option>
                        <option value="history">History</option>
                        <option value="biography">Biography</option>
                        <option value="thriller">Thriller</option>
                        <option value="young-adult">Young Adult</option>
                        <option value="children">Children's</option>
                        <option value="classic">Classic</option>
                        <option value="self-help">Self-Help</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="rating">Minimum Rating</label>
                    <input type="number" id="rating" class="filter-input" min="1" max="5" value="3" step="0.1">
                </div>
                
                <button class="apply-filters-btn btn-primary" onclick="applyBookFilters()" style="padding: 0.75rem;">Apply Filters</button>
            </div>
        </div>
    <div id="book-result" class="book-suggestion glass-panel" style="display:none; text-align: center;">
            <!-- Book details here -->
            <h2 id="book-title"></h2>
            <p id="book-description"></p>
            <span id="book-author"></span><br>
            <span id="book-year" style="font-size: 0.9em; color: #666;"></span><br>
            <span id="book-rating"></span><br>
            
            <!-- Favorites control -->
            <div class="fav-controls" style="margin: 1rem 0;">
                <button id="book-fav-toggle-btn" class="fav-btn icon-only" type="button" aria-pressed="false" title="Save to favorites">
                    <svg class="heart-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path class="heart-path" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                </button>
            </div>
            
            <button id="goodreads-link" style="display:none; margin-right:8px;" class="goodreads-btn">📖 View on Goodreads</button>
            <button id="preview-btn" style="display:none;" class="btn-primary" style="padding: 0.5rem;">Preview Book</button>
            <img id="book-cover" alt="Book Cover" style="margin: 1.5rem auto; border-radius: 12px; box-shadow: var(--shadow-sm);"/>
            <button id="next-book-btn" class="btn-primary" style="margin-top:1.5rem;">Next Book</button>
        </div>
        
        <div class="navigation-footer">
            <button class="home-btn" onclick="window.location.href='index.html'">
                ← Back to Decidr
            </button>
        </div>
    </main>
    <script src="scripts/utils.js"></script>
    <script src="scripts/data/curated-books.js"></script>
    <script src="scripts/books.js"></script>
</body>
</html>
